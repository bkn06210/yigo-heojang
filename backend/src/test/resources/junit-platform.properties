# 속성 기반 테스트(jqwik) 설정. Jupiter 테스트에는 영향이 없다.

# 실패한 시드를 기억하는 파일. 저장소에 섞이지 않게 빌드 산출물 폴더에 둔다
jqwik.database = target/jqwik-database

# 속성마다 시드를 고정해 두었다. 고정 시드는 의도한 것이므로 경고하지 않는다
jqwik.seeds.whenfixed = ALLOW

# 시도 횟수·검사 횟수·분포 통계를 통과한 속성에도 찍는다 — 몇 건을 봤는지가 이 테스트의 근거다
jqwik.reporting.onlyfailures = false

# jqwik이 끼워 넣는 경계값(각 범위의 최소·최대)을 끈다. 여러 값을 조합해 만드는 입력에서는 경계값
# 조합이 무작위 값보다 많아져, 생성기에 적어 둔 비율(NULL 한도 55% 등)이 무너진다.
# 필요한 경계(한도 0, NULL, 요율 0%·100%, 1원 결제)는 생성기가 비율을 정해 직접 섞는다.
jqwik.edgecases.default = NONE
