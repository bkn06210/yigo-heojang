# 챗봇 서버(파이썬) 호출의 시간 제한과 장애 격리 설정.
#
# 비밀값이 아니고 환경마다 다를 이유도 없어 저장소에 올린다.
# 로컬에서만 바꿔 보려면 db.properties 에 같은 키를 적는다 — root-context.xml 이 이 파일을
# 먼저 읽고 db.properties 를 나중에 읽어, 같은 키면 뒤의 값이 이긴다.
#
# 시간은 바깥이 안쪽보다 길어야 한다.
#   Spring 읽기 타임아웃 25초 > 챗봇 서버의 요청 마감시간 20초 > LLM·임베딩·엔진 호출 각각
# 거꾸로면 Spring 이 이미 끊고 503 을 낸 뒤에도 챗봇 서버는 LLM 을 계속 불러 토큰을 쓰고,
# 그렇게 만든 답은 받을 사람이 없어 버려진다.

# 챗봇 서버가 떠 있지 않은 것을 빨리 알아채기 위한 값. 같은 기기·같은 네트워크라 정상이면 즉시 연결된다.
chatbot.connect-timeout-millis=2000
# 챗봇 서버의 마감시간(CHAT_DEADLINE_SECONDS=20)에 5초 여유를 둔다. 마감에 걸린 챗봇이
# 대체 답변을 만들어 돌려보내는 시간이다. 여유가 없으면 대체 답변이 오기 직전에 끊어 503 이 된다.
chatbot.read-timeout-millis=25000

# ── 동시 호출 상한 (bulkhead) ──────────────────────────────
# 채팅이 동시에 붙잡을 수 있는 톰캣 스레드 수. 넘는 요청은 기다리지 않고 바로 503 을 받는다.
#
# 톰캣 기본 스레드 200개의 10%. 채팅 한 건이 약 4초(실측 3.8초)라 초당 5건을 받는 셈이고,
# 시연 규모엔 충분하다. 나머지 90% 는 결제·추천 같은 다른 API 몫으로 남는다.
#
# 챗봇은 답을 만들며 이 서버의 엔진 API 를 다시 부른다. 채팅이 스레드를 전부 쥐고 있으면
# 그 되부름이 스레드를 얻지 못해 엔진 호출 타임아웃까지 멈춰 있다가 실패한다 — 채팅은 엔진을,
# 엔진은 채팅이 놓아줄 스레드를 기다린다. 상한이 되부름 몫의 스레드를 남겨 둔다.
# 챗봇 서버의 요청 처리 스레드(기본 40개)보다 작게 두어 챗봇 쪽에서 줄을 서는 일도 막는다.
chatbot.bulkhead.max-concurrent-calls=20

# ── 차단기 (circuit breaker) ──────────────────────────────
# 최근 호출 20건 중 실패나 느린 호출이 절반 이상이면 연다. 열린 동안은 챗봇을 부르지 않고 바로 503.
chatbot.circuit-breaker.sliding-window-size=20
# 이만큼 쌓이기 전에는 비율을 보지 않는다. 두세 건으로 판단하면 한 번의 실패로도 열린다.
chatbot.circuit-breaker.minimum-number-of-calls=10
chatbot.circuit-breaker.failure-rate-threshold=50
# 챗봇 서버는 LLM 이 멈춰도 마감시간(20초)에 대체 답변을 200 으로 돌려준다. 실패로는 안 잡히지만
# 스레드는 매번 20초씩 묶이므로 "느린 성공"도 센다. 정상 답변은 실측 3.8초라 15초면 둘이 갈린다.
# LLM 모델을 바꾸면 이 값을 다시 잰다 — 추론형 모델은 한 번 호출에 7~8초가 걸리기도 했다.
chatbot.circuit-breaker.slow-call-duration-threshold-millis=15000
chatbot.circuit-breaker.slow-call-rate-threshold=50
# 열린 뒤 이만큼 지나면 몇 건만 흘려 보내 회복했는지 본다. 챗봇 서버 재기동이 수 초~십수 초라
# 30초면 대개 회복한 뒤다. 너무 짧으면 아직 멈춰 있는 서버에 시험 호출이 거듭 들어가 매번 25초씩 묶인다.
chatbot.circuit-breaker.wait-duration-in-open-state-millis=30000
chatbot.circuit-breaker.permitted-number-of-calls-in-half-open-state=3
