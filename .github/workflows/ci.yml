name: CI

# push(develop·main)와 모든 PR에서 모노레포 전체를 검사한다.
# 목적: 회귀 자동 감지 + PR 본문의 "다른 파트 영향 없음"을 기계로 뒷받침.
#
# 파트별로 job을 나눈 이유는 두 가지다.
#   ① 병렬로 돌아 전체 시간이 느린 쪽 하나만큼만 걸린다
#   ② 실패한 job 이름만 봐도 어느 파트가 깨졌는지 바로 안다
#
# 변경 경로로 job을 건너뛰게(paths 필터) 하지 않는다. 필수 체크로 지정된 job이 skip되면
# "통과"가 아니라 "미실행"으로 남아 머지 판정이 애매해지기 때문이다. 둘 다 항상 돌린다.
#
# ⚠️ job을 추가하면 GitHub 저장소 설정에서 필수 체크 목록에도 추가해야 머지를 막는다
#    (Settings → Rules → protect-develop → Require status checks). 안 하면 빨간불이어도 머지된다.
#
# ai-server(Python)는 아직 소스가 없어 job이 없다. 챗봇 서버가 들어오면 job을 하나 더 추가한다.
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  # 이름을 바꾸지 말 것 — develop 보호 규칙이 이 이름을 필수 체크로 지정하고 있다.
  backend-test:
    runs-on: ubuntu-latest

    # 통합 테스트가 실 MySQL을 요구한다(H2 배제). 로컬 docker-compose의 yigo-mysql과 같은 이미지.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wallet
        ports:
          - 3306:3306
        # 헬스체크가 통과해야 이후 스텝이 시작된다 → 스키마 적재가 기동 전에 도는 레이스 방지.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 컨테이너는 빈 wallet DB만 만든다. 테이블은 schema.sql로 적재한다.
      - name: Load schema into MySQL
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot wallet < db/schema.sql

      # db.properties는 gitignore라 저장소에 없다(개인 접속값). CI 접속값으로 새로 만든다.
      # allowPublicKeyRetrieval=true: 새 MySQL의 caching_sha2 최초 인증이 평문 TCP에서 막히지 않게.
      - name: Generate db.properties for CI
        run: |
          cat > src/main/resources/db.properties <<'EOF'
          db.driver=com.mysql.cj.jdbc.Driver
          db.url=jdbc:mysql://127.0.0.1:3306/wallet?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
          db.username=root
          db.password=root

          mail.host=localhost
          mail.port=2525
          mail.username=test
          mail.password=test
          mail.from=test@example.com
          mail.smtp.auth=false
          mail.smtp.starttls.enable=false
          mail.smtp.connectiontimeout=1000
          mail.smtp.timeout=1000
          mail.smtp.writetimeout=1000
          mail.debug=false
          EOF

      # redis.properties도 gitignore라 저장소에 없다. root-context.xml이 property-placeholder로
      # 이 파일을 읽어 JedisPool 빈을 만드는데, 파일이 없으면 그 순간 XML 파싱 자체가 실패해서
      # redis.properties와 무관한 다른 도메인의 통합 테스트까지 ApplicationContext 로드 실패로
      # 전부 죽는다(같은 root-context.xml을 공유하기 때문). 값이 실제로 동작할 필요는 없다 —
      # 이 파이프라인의 어떤 테스트도 Redis에 실제로 접속을 시도하지 않는다(JedisPool은 지연 연결).
      - name: Generate redis.properties for CI
        run: |
          cat > src/main/resources/redis.properties <<'EOF'
          redis.host=localhost
          redis.port=6379
          redis.password=
          redis.timeout-millis=2000

          redis.pool.max-total=16
          redis.pool.max-idle=8
          redis.pool.min-idle=2

          redis.unread-count.ttl-seconds=3600
          redis.lock.ttl-seconds=600
          EOF

      # mvnw는 저장소에 실행권한 없이 커밋돼 있어(100644) chmod가 필요하다.
      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  # 프론트엔드는 아직 테스트 스크립트가 없어 빌드로 검사한다.
  # 빌드만으로도 문법 오류·중복 선언·닫히지 않은 태그·없는 모듈 import가 전부 걸린다
  # (실제로 이런 사고가 있었다: 중복 import 한 줄 때문에 앱 첫 화면이 백지가 됐고,
  #  backend만 검사하던 CI는 초록불이었다).
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Vite 8은 Node 20.19+ 또는 22.12+를 요구한다. 22로 고정해 둔다.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm install이 아니라 npm ci — package-lock.json을 그대로 재현한다.
      # 사람마다 다른 버전이 깔려 "내 로컬에선 되는데"가 생기는 것을 막고,
      # lock과 package.json이 어긋나면 여기서 바로 실패한다.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
